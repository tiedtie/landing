<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tech star in space">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="starCore" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" x2="1">
