  <path d="M32 11.5L36.2 24.8L49.5 32L36.2 39.2L32 52.5L27.8 39.2L14.5 32L27.8 24.8L32 11.5Z" fill="url(#starCore)" stroke="#fef3c7" stroke-width="1.2" filter="url(#glow)"/>

